<!doctype html>
<html lang="zh-Hant">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0WRZ173JVH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-0WRZ173JVH');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小學學習冒險島</title>
  <meta name="description" content="國小課文與數學複習互動練習平台。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="site-shell">
    <section class="hero" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="hero-kicker">國小互動練習平台</p>
        <h1 id="home-title">小學學習冒險島</h1>
        <p class="hero-text">把課程變成孩子可以自己闖關的互動練習</p>
        <div class="hero-actions">
          <a class="primary-link" href="#grade-2">開始二年級練習</a>
        </div>
      </div>
      <div class="hero-side" aria-label="年級入口">
        <div class="grade-grid">
          <div class="grade-card"><strong>一年級</strong><span>規劃中</span></div>
          <a class="grade-card active" href="#grade-2"><strong>二年級</strong><span>開始練習</span></a>
          <div class="grade-card"><strong>三年級</strong><span>規劃中</span></div>
          <div class="grade-card"><strong>四年級</strong><span>規劃中</span></div>
          <div class="grade-card"><strong>五年級</strong><span>規劃中</span></div>
          <div class="grade-card"><strong>六年級</strong><span>規劃中</span></div>
        </div>
      </div>
    </section>

    <section class="course-section" id="grade-2" aria-labelledby="grade-2-title">
      <div class="section-head">
        <div>
          <p class="section-kicker">二年級課程</p>
          <h2 id="grade-2-title">二年級課程入口</h2>
        </div>
      </div>
      <div class="course-grid" id="course-grid"></div>
    </section>

    <section class="support-section" aria-label="平台說明">
      <article class="support-card">
        <p class="section-kicker">給家長的話</p>
        <h2>孩子可以直接開始練習</h2>
        <p>不需要登入、不蒐集姓名或帳號資料；網站僅使用匿名流量統計，幫助改善練習內容。</p>
      </article>
      <article class="support-card">
        <p class="section-kicker">給老師的話</p>
        <h2>目前先從二下建立平台骨架</h2>
        <p>目前以二年級下學期為第一階段，後續可能依年級、科目、課次擴充。</p>
      </article>
    </section>

    <footer class="site-footer">
      <p>提供國小學童練習使用。</p>
      <p>Interactive design by chaohuang-TW</p>
    </footer>
  </main>

  <template id="course-card-template">
    <a class="course-card" href="">
      <p class="course-label"></p>
      <h3 class="course-name"></h3>
      <p class="course-focus"></p>
      <span class="course-action">進入練習</span>
    </a>
  </template>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <title>員工特約優惠專區</title>
    <link rel="icon" href="about:blank">
    <link rel="stylesheet" href="benefits.css?v=20260714">
    <script src="benefits.js?v=20260714" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#benefit-list">跳至優惠清單</a>

    <header class="hero">
      <div class="shell hero__inner">
        <p class="hero__eyebrow">STAFF BENEFITS</p>
        <h1>員工特約優惠專區</h1>
        <p class="hero__description">住宿、餐飲、交通與醫療優惠，一次整理，快速找到需要的資訊。</p>
        <p class="hero__notice">優惠內容可能因廠商政策調整；使用前請再次確認適用門市、日期及限制。</p>
      </div>
    </header>

    <main>
      <div id="list-view">
        <section class="category-section shell" aria-labelledby="category-title">
          <div class="section-heading">
            <h2 id="category-title" tabindex="-1">想找哪一類優惠？</h2>
            <button id="show-all-top" class="text-button" type="button" hidden>顯示全部</button>
          </div>
          <div id="category-buttons" class="category-grid" role="group" aria-label="優惠類別"></div>
        </section>

        <section class="search-section shell" aria-labelledby="search-label">
          <label id="search-label" for="benefit-search">搜尋優惠</label>
          <input id="benefit-search" type="search" autocomplete="off" placeholder="輸入廠商、優惠、地區或服務">
        </section>

        <section class="benefits-section shell" aria-labelledby="benefits-title">
          <div class="section-heading section-heading--results">
            <h2 id="benefits-title">目前可用優惠</h2>
            <p id="result-count" class="result-count" aria-live="polite"></p>
          </div>
          <p id="loading-state" class="state-message" aria-live="polite">正在整理優惠資料…</p>
          <div id="benefit-list" class="benefit-list"></div>
          <div id="empty-state" class="empty-state" aria-live="polite" hidden>
            <h3>找不到符合條件的優惠</h3>
            <p>請更換關鍵字，或顯示全部優惠。</p>
            <button id="show-all-empty" class="button" type="button">顯示全部</button>
          </div>
          <p id="error-state" class="state-message state-message--error" aria-live="polite" hidden>優惠資料暫時無法載入，請稍後再試。</p>
        </section>
      </div>

      <section id="detail-view" class="detail-view shell" aria-live="polite" hidden>
        <button id="back-to-list" class="back-button" type="button">← 返回優惠列表</button>
        <article id="detail-content" class="detail-content"></article>
        <button id="print-detail" class="button print-button" type="button">列印／儲存 PDF</button>
      </section>
    </main>

    <footer class="footer">
      <div class="shell footer__inner">
        <p>本頁為特約優惠資訊彙整，非各廠商官方網站。優惠內容若有異動，以廠商實際說明為準。</p>
        <p>本頁未設會員系統，也不要求輸入姓名、帳號或其他個人資料。</p>
        <a href="/">返回網站首頁</a>
      </div>
    </footer>
  </body>
</html>
